name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore and build backend and dashboard
        run: ./scripts/build.sh
      - name: Run backend tests
        run: ./scripts/test.sh

  package-agent-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish standalone Agent EXE
        shell: bash
        run: ./scripts/publish-agent-windows.sh
      - name: Verify Agent EXE starts
        shell: pwsh
        run: |
          & ./artifacts/agent/win-x64/SentinelAI.Agent.exe
          if ($LASTEXITCODE -ne 0) { throw "Agent EXE exited with code $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: SentinelAI.Agent-win-x64
          path: artifacts/agent/win-x64/SentinelAI.Agent.exe
          if-no-files-found: error
