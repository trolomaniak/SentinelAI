name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore and build solution and dashboard
        run: ./scripts/build.sh
      - name: Run backend, desktop foundation and dashboard tests
        run: |
          set +e
          ./scripts/test.sh > "$RUNNER_TEMP/sentinelai-regression-test.log" 2>&1
          test_exit_code=$?
          tail -n 35 "$RUNNER_TEMP/sentinelai-regression-test.log"
          if [ "$test_exit_code" -ne 0 ]; then
            python3 - <<'PY'
          import os
          from pathlib import Path
          lines = Path(os.environ['RUNNER_TEMP'], 'sentinelai-regression-test.log').read_text(errors='replace').splitlines()
          message = '\n'.join(line for line in lines[-35:] if not line.startswith('{'))[-3800:]
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Regression tests::' + message)
          PY
          fi
          exit "$test_exit_code"

  package-agent-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run Agent enrollment tests on Windows
        shell: pwsh
        run: |
          dotnet run --project tests/SentinelAI.Agent.Tests/SentinelAI.Agent.Tests.csproj --configuration Release *> "$env:RUNNER_TEMP\sentinelai-agent-test.log"
          $testExitCode = $LASTEXITCODE
          $tail = Get-Content "$env:RUNNER_TEMP\sentinelai-agent-test.log" | Select-Object -Last 25
          $tail
          if ($testExitCode -ne 0) {
            $message = ($tail -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows Agent enrollment test::$message"
          }
          exit $testExitCode
      - name: Publish standalone Agent EXE
        shell: bash
        run: ./scripts/publish-agent-windows.sh
      - name: Verify Agent EXE starts
        shell: pwsh
        run: |
          $agent = Start-Process -FilePath (Resolve-Path ./artifacts/agent/win-x64/SentinelAI.Agent.exe).Path -PassThru
          try {
            Start-Sleep -Seconds 5
            $agent.Refresh()
            if ($agent.HasExited) { throw "Agent EXE exited early with code $($agent.ExitCode)" }
          } finally {
            $agent.Refresh()
            if (-not $agent.HasExited) {
              Stop-Process -Id $agent.Id -Force
              $agent.WaitForExit(10000) | Out-Null
            }
          }
      - name: Verify Agent runs as a Windows Service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $serviceName = 'SentinelAIAgent'
          $exe = (Resolve-Path ./artifacts/agent/win-x64/SentinelAI.Agent.exe).Path
          New-Service -Name $serviceName -BinaryPathName "`"$exe`"" -StartupType Manual
          try {
            Start-Service -Name $serviceName
            Start-Sleep -Seconds 5
            if ((Get-Service -Name $serviceName).Status -ne 'Running') {
              throw 'Agent service stopped while Core was unavailable.'
            }
          } finally {
            $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
            if ($service -and $service.Status -ne 'Stopped') {
              Stop-Service -Name $serviceName
            }
            sc.exe delete $serviceName | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Could not remove the temporary Agent service.' }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SentinelAI.Agent-win-x64
          path: artifacts/agent/win-x64/SentinelAI.Agent.exe
          if-no-files-found: error

  core-service-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run Core hosting and persistence tests
        shell: pwsh
        run: |
          dotnet run --project tests/SentinelAI.Core.Tests/SentinelAI.Core.Tests.csproj --configuration Release *> "$env:RUNNER_TEMP\sentinelai-core-test.log"
          $testExitCode = $LASTEXITCODE
          $tail = Get-Content "$env:RUNNER_TEMP\sentinelai-core-test.log" | Select-Object -Last 35
          $tail
          if ($testExitCode -ne 0) {
            $message = (($tail | Where-Object { -not $_.StartsWith('{') }) -join "`n")
            if ($message.Length -gt 3800) { $message = $message.Substring($message.Length - 3800) }
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows Core hosting test::$message"
          }
          exit $testExitCode
      - name: Run portable Core service installer tests
        shell: pwsh
        run: |
          ./tests/core-service/Workflow.Tests.ps1
          ./tests/core-service/Health.Tests.ps1
      - name: Prepare signed development pilot bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $keys = Join-Path $env:RUNNER_TEMP ('sentinelai-service-keys-' + [Guid]::NewGuid().ToString('N'))
          dotnet run --project tools/update-dev --configuration Release -- keygen --directory $keys --key-id dev-service-ci
          if ($LASTEXITCODE -ne 0) { throw 'Development key generation failed.' }
          try {
            ./scripts/publish-pilot-windows.ps1 -Version 1.0.0 -DevelopmentPrivateKey (Join-Path $keys 'dev-service-ci.private.pem') -KeyId dev-service-ci
            $publicKey = Join-Path $env:RUNNER_TEMP 'sentinelai-service-ci.public.pem'
            Copy-Item -LiteralPath (Join-Path $keys 'dev-service-ci.public.pem') -Destination $publicKey
          } finally {
            Remove-Item -LiteralPath $keys -Recurse -Force
          }
      - name: Publish desktop for independent-lifetime acceptance
        shell: bash
        run: ./scripts/publish-desktop-windows.sh
      - name: Verify native Core service lifecycle and recovery
        shell: pwsh
        run: |
          try {
            ./tests/core-service/Windows.Acceptance.ps1 -BundleDirectory ./artifacts/pilot/win-x64/1.0.0 `
              -PublicKeyPath (Join-Path $env:RUNNER_TEMP 'sentinelai-service-ci.public.pem') `
              -KeyId dev-service-ci -Environment development -Channel pilot `
              -DesktopExecutablePath ./artifacts/desktop/win-x64/SentinelAI.Desktop.exe
          } catch {
            $message = $_.Exception.Message + "`n" + $_.ScriptStackTrace
            if ($message.Length -gt 3800) { $message = $message.Substring($message.Length - 3800) }
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Native Core service acceptance::$message"
            throw
          }

      - name: Verify native Desktop authentication and security workspaces
        shell: powershell
        run: |
          try {
            ./tests/desktop/Authentication.Acceptance.ps1 -BundleDirectory ./artifacts/pilot/win-x64/1.0.0 `
              -PublicKeyPath (Join-Path $env:RUNNER_TEMP 'sentinelai-service-ci.public.pem') `
              -KeyId dev-service-ci -Environment development -Channel pilot `
              -ExecutablePath ./artifacts/desktop/win-x64/SentinelAI.Desktop.exe -VerifyDevices -VerifyAlerts -VerifyRiskReports -VerifyAiLicenseSettings -VerifyBrowserless
          } catch {
            $message = $_.Exception.Message + "`n" + $_.ScriptStackTrace
            if ($message.Length -gt 3800) { $message = $message.Substring($message.Length - 3800) }
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Native Desktop authentication::$message"
            throw
          }

  package-desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run desktop foundation tests
        shell: pwsh
        run: dotnet run --project tests/SentinelAI.Desktop.Tests/SentinelAI.Desktop.Tests.csproj --configuration Release
      - name: Run native WPF navigation and DPI tests
        shell: pwsh
        run: |
          dotnet run --project tests/SentinelAI.Desktop.Windows.Tests/SentinelAI.Desktop.Windows.Tests.csproj --configuration Release --runtime win-x64 *> "$env:RUNNER_TEMP\sentinelai-desktop-test.log"
          $testExitCode = $LASTEXITCODE
          $tail = Get-Content "$env:RUNNER_TEMP\sentinelai-desktop-test.log" | Select-Object -Last 35
          $tail
          if ($testExitCode -ne 0) {
            $message = ($tail -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Native WPF navigation test::$message"
          }
          exit $testExitCode
      - name: Publish self-contained Windows desktop
        shell: bash
        run: ./scripts/publish-desktop-windows.sh
      - name: Verify published desktop opens and shuts down gracefully
        shell: pwsh
        run: ./tests/desktop/Windows.Acceptance.ps1 -ExecutablePath ./artifacts/desktop/win-x64/SentinelAI.Desktop.exe
      - uses: actions/upload-artifact@v4
        with:
          name: SentinelAI.Desktop-win-x64
          path: artifacts/desktop/win-x64/
          if-no-files-found: error

  setup-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run portable Setup installation and lifecycle policy tests
        shell: pwsh
        run: |
          ./tests/setup/Workflow.Tests.ps1
          ./tests/setup/Lifecycle.Tests.ps1
      - name: Publish one native Setup EXE with a private self-contained runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $keys = Join-Path $env:RUNNER_TEMP ('sentinelai-setup-keys-' + [Guid]::NewGuid().ToString('N'))
          try {
            dotnet run --project tools/update-dev --configuration Release -- keygen --directory $keys --key-id dev-ci-setup
            if ($LASTEXITCODE -ne 0) { throw 'Development Setup key generation failed.' }
            ./scripts/publish-setup-windows.ps1 -Version 1.0.0 -KeyId dev-ci-setup `
              -DevelopmentPrivateKey (Join-Path $keys 'dev-ci-setup.private.pem') `
              -PublicKeyPath (Join-Path $keys 'dev-ci-setup.public.pem') `
              -OutputDirectory (Join-Path $env:RUNNER_TEMP 'sentinelai-setup-artifact')
          } catch {
            $message = $_.Exception.Message + "`n" + $_.ScriptStackTrace
            if ($message.Length -gt 3800) { $message = $message.Substring($message.Length - 3800) }
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Single EXE Setup publishing::$message"
            throw
          } finally {
            if (Test-Path -LiteralPath $keys) { Remove-Item -LiteralPath $keys -Recurse -Force }
          }
      - name: Verify native Setup wrapper, protected WPF child and complete deployment
        shell: powershell
        run: |
          try {
            ./tests/setup/Windows.Acceptance.ps1 `
              -ExecutablePath (Join-Path $env:RUNNER_TEMP 'sentinelai-setup-artifact/SentinelAI-Setup.exe') `
              -TimeoutSeconds 300
          } catch {
            $message = $_.Exception.Message + "`n" + $_.ScriptStackTrace
            if ($message.Length -gt 3800) { $message = $message.Substring($message.Length - 3800) }
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Native single EXE Setup acceptance::$message"
            throw
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SentinelAI-Setup-win-x64
          path: ${{ runner.temp }}/sentinelai-setup-artifact/SentinelAI-Setup.exe
          if-no-files-found: error

  setup-lifecycle-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish older, newer and signed unhealthy development Setup executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $keys = Join-Path $env:RUNNER_TEMP ('sentinelai-lifecycle-keys-' + [Guid]::NewGuid().ToString('N'))
          $outputs = Join-Path $env:RUNNER_TEMP 'sentinelai-lifecycle-artifacts'
          $fault = Join-Path $env:RUNNER_TEMP 'sentinelai-lifecycle-unhealthy-core'
          try {
            dotnet run --project tools/update-dev --configuration Release -- keygen --directory $keys --key-id dev-ci-lifecycle
            if ($LASTEXITCODE -ne 0) { throw 'Development lifecycle key generation failed.' }
            dotnet build ./tests/setup/unhealthy-core/SentinelAI.Core.csproj --configuration Release --output $fault
            if ($LASTEXITCODE -ne 0) { throw 'Unhealthy test-only SCM assembly build failed.' }
            foreach ($version in @('1.0.0', '1.1.0', '1.2.0')) {
              $options = @{
                Version = $version; KeyId = 'dev-ci-lifecycle'
                DevelopmentPrivateKey = Join-Path $keys 'dev-ci-lifecycle.private.pem'
                PublicKeyPath = Join-Path $keys 'dev-ci-lifecycle.public.pem'
                OutputDirectory = Join-Path $outputs $version
              }
              if ($version -eq '1.2.0') { $options.DevelopmentCoreAssemblyOverride = Join-Path $fault 'SentinelAI.Core.dll' }
              ./scripts/publish-setup-windows.ps1 @options
            }
          } catch {
            $message = $_.Exception.Message + "`n" + $_.ScriptStackTrace
            if ($message.Length -gt 3800) { $message = $message.Substring($message.Length - 3800) }
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Lifecycle Setup publishing::$message"
            throw
          } finally {
            if (Test-Path -LiteralPath $keys) { Remove-Item -LiteralPath $keys -Recurse -Force }
          }
      - name: Verify actual Windows upgrade, health rollback, repair and uninstall
        shell: powershell
        run: |
          try {
            $outputs = Join-Path $env:RUNNER_TEMP 'sentinelai-lifecycle-artifacts'
            ./tests/setup/Lifecycle.Acceptance.ps1 `
              -InitialExecutablePath (Join-Path $outputs '1.0.0/SentinelAI-Setup.exe') `
              -UpgradeExecutablePath (Join-Path $outputs '1.1.0/SentinelAI-Setup.exe') `
              -UnhealthyExecutablePath (Join-Path $outputs '1.2.0/SentinelAI-Setup.exe') `
              -TimeoutSeconds 300
          } catch {
            $message = $_.Exception.Message + "`n" + $_.ScriptStackTrace
            if ($message.Length -gt 3800) { $message = $message.Substring($message.Length - 3800) }
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Native Setup lifecycle acceptance::$message"
            throw
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SentinelAI-Setup-lifecycle-win-x64
          path: ${{ runner.temp }}/sentinelai-lifecycle-artifacts/1.1.0/SentinelAI-Setup.exe
          if-no-files-found: error
